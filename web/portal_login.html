<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Client sign in – __AGENCY__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--night:#13202b;--surface:#ffffff;--ink:#18212b;--muted:#5e6b78;--line:#dce2e0;--accent:#c2410c;--accent-hover:#9a3412;--accent-ink:#fff;--accent-soft:#fde9d9;--bad:#b4261e;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--night:#0b1115;--surface:#161e24;--ink:#e3e9ed;--muted:#94a3af;--line:#27333b;--accent:#ff8a3d;--accent-hover:#ffa463;--accent-ink:#1c0c02;--accent-soft:#3b2112;--bad:#ff8f86;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--night);color:var(--ink);
  font:15px/1.55 "Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100vh;display:grid;place-items:center;padding:24px}
.wrap{width:100%;max-width:380px}
.brand{display:flex;flex-direction:column;gap:8px;color:#e8eef2;font-weight:650;font-size:16px;margin:0 0 18px 4px}
.brand img{display:block;width:200px;max-width:100%;height:auto}
.brand.has-logo .co{display:none}
.brand.has-logo span{font-size:13.5px;color:#9fb0bd;font-weight:600}
form{background:var(--surface);border-radius:12px;padding:28px}
h1{font-size:22px;line-height:1.25;margin:0 0 4px;letter-spacing:-.015em;font-weight:650}
p{color:var(--muted);margin:0 0 18px;font-size:14px}
label{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px 12px;width:100%}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button{margin-top:22px;width:100%;font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);
  color:var(--accent-ink);border-radius:7px;padding:11px 16px;cursor:pointer}
button:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.6;cursor:progress}
.err{color:var(--bad);font-size:14px;min-height:1.4em;margin-top:12px}
</style>
</head>
<body>
<main>
<div class="wrap">
  <div class="brand"><img src="/brand/logo-dark" alt="__AGENCY__" onload="this.parentNode.classList.add('has-logo')" onerror="this.remove()"><span><span class="co">__AGENCY__ </span>Client portal</span></div>
  <form id="f">
    <h1>Client sign in</h1>
    <p>Your AI visibility reports, scores and monitoring.</p>
    <label for="u">Email</label>
    <input id="u" name="email" type="email" autocomplete="username" required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">Sign in</button>
    <div class="err" id="e" role="alert"></div>
  </form>
</div>
</main>
<script>
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('e');
  b.disabled = true; err.textContent = '';
  try{
    const r = await fetch('/api/portal/login', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email: document.getElementById('u').value, password: document.getElementById('p').value})});
    const d = await r.json();
    if (r.ok && d.ok){ location.href = '/portal'; return; }
    err.textContent = d.error || 'Sign in failed.';
  }catch(x){ err.textContent = 'Could not reach the server. Try again.'; }
  b.disabled = false;
});
document.getElementById('u').focus();
</script>
</body>
</html>
