<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – Clay Visibility Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{--bg:#f4f4f5;--surface:#ffffff;--ink:#18181b;--muted:#71717a;--line:#e4e4e7;--accent:#c2410c;--accent-hover:#9a3412;--accent-ink:#ffffff;--accent-soft:#fff1e6;--bad:#b91c1c;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0f0f12;--surface:#1b1b20;--ink:#f4f4f5;--muted:#a1a1aa;--line:#2a2a31;--accent:#ff8a3d;--accent-hover:#ffa463;--accent-ink:#1c0c02;--accent-soft:#2e1a0e;--bad:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:15px/1.55 "Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100vh;display:grid;place-items:center;padding:24px}
.wrap{width:100%;max-width:400px}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 0 24px;text-align:center;color:var(--ink);
  font:800 21px/1.2 "Archivo","Instrument Sans",sans-serif;font-stretch:112%}
.brand picture,.brand img{display:block;width:216px;max-width:100%;height:auto}
.brand.has-logo .co{display:none}
.brand.has-logo span{font:600 13.5px/1.3 "Instrument Sans",sans-serif;color:var(--muted)}
form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px;
  box-shadow:0 1px 2px rgba(24,24,27,.05),0 16px 40px -18px rgba(24,24,27,.18)}
h1{font:800 24px/1.2 "Archivo","Instrument Sans",sans-serif;font-stretch:112%;margin:0 0 6px}
p{color:var(--muted);margin:0 0 20px;font-size:14px}
label{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;min-height:44px}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button{margin-top:22px;width:100%;font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);
  color:var(--accent-ink);border-radius:9px;padding:11px 16px;min-height:46px;cursor:pointer}
button:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.6;cursor:progress}
.err{color:var(--bad);font-size:14px;min-height:1.4em;margin-top:12px}
</style>
</head>
<body>
<main>
<div class="wrap">
  <div class="brand"><picture><source srcset="/brand/logo-dark" media="(prefers-color-scheme: dark)"><img src="/brand/logo-light" alt="The Clay Media" onload="this.closest('.brand').classList.add('has-logo')" onerror="this.closest('picture').remove()"></picture><span><span class="co">Clay </span>Visibility Studio</span></div>
  <form id="f">
    <h1>Sign in</h1>
    <p>See your clients' sites the way AI crawlers and assistants do.</p>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">Sign in</button>
    <div class="err" id="e" role="alert"></div>
  </form>
</div>
</main>
<script>
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('e');
  b.disabled = true; err.textContent = '';
  try{
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username: document.getElementById('u').value, password: document.getElementById('p').value})});
    const d = await r.json();
    if (r.ok && d.ok){ location.href = '/'; return; }
    err.textContent = d.error || 'Sign in failed.';
  }catch(x){ err.textContent = 'Could not reach the server. Try again.'; }
  b.disabled = false;
});
document.getElementById('u').focus();
</script>
</body>
</html>
