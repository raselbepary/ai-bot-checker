<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – AI Bot View Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--night:#13202b;--surface:#ffffff;--ink:#18212b;--muted:#5e6b78;--line:#dce2e0;--accent:#0b7a6e;--accent-hover:#086257;--accent-ink:#fff;--accent-soft:#e0f1ee;--bad:#b4261e;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--night:#0b1115;--surface:#161e24;--ink:#e3e9ed;--muted:#94a3af;--line:#27333b;--accent:#3cbfab;--accent-hover:#5ad0bd;--accent-ink:#04221d;--accent-soft:#12332e;--bad:#ff8f86;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--night);color:var(--ink);
  font:15px/1.55 "Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100vh;display:grid;place-items:center;padding:24px}
.wrap{width:100%;max-width:380px}
.brand{display:flex;align-items:center;gap:10px;color:#e8eef2;font-weight:650;font-size:16px;margin:0 0 18px 4px}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mark svg{width:19px;height:19px}
form{background:var(--surface);border-radius:12px;padding:28px}
h1{font-size:22px;line-height:1.25;margin:0 0 4px;letter-spacing:-.015em;font-weight:650}
p{color:var(--muted);margin:0 0 18px;font-size:14px}
label{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px 12px;width:100%}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button{margin-top:22px;width:100%;font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);
  color:var(--accent-ink);border-radius:7px;padding:11px 16px;cursor:pointer}
button:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.6;cursor:progress}
.err{color:var(--bad);font-size:14px;min-height:1.4em;margin-top:12px}
</style>
</head>
<body>
<main>
<div class="wrap">
  <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></span>AI Bot View Checker</div>
  <form id="f">
    <h1>Sign in</h1>
    <p>See your clients' sites the way AI crawlers and assistants do.</p>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">Sign in</button>
    <div class="err" id="e" role="alert"></div>
  </form>
</div>
</main>
<script>
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('e');
  b.disabled = true; err.textContent = '';
  try{
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username: document.getElementById('u').value, password: document.getElementById('p').value})});
    const d = await r.json();
    if (r.ok && d.ok){ location.href = '/'; return; }
    err.textContent = d.error || 'Sign in failed.';
  }catch(x){ err.textContent = 'Could not reach the server. Try again.'; }
  b.disabled = false;
});
document.getElementById('u').focus();
</script>
</body>
</html>
